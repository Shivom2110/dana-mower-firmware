[env]
platform = ststm32
board = giga_r1_m7
framework = arduino
monitor_speed = 115200

; Full controller: handles, ignition, E-stop, safety state machine, TM4 CAN.
[env:giga_r1_m7]
lib_deps =
  symlink://../common
build_src_filter = +<*> -<bench_can_test.cpp> -<web_control.cpp>

; Bench replacement for V2_CAN_Test.py: CAN only, started/stopped over USB serial.
[env:giga_r1_m7_can_bench]
build_src_filter = +<tm4_can.cpp> +<bench_can_test.cpp>

; SmartMow website control over the GIGA's Wi-Fi (see /website): CAN + HTTP API.
; Ignores handles/ignition/E-stop like the bench tool; physical E-stop must cut power.
[env:giga_r1_m7_web]
lib_deps =
  symlink://../common
build_src_filter = +<tm4_can.cpp> +<web_control.cpp>
